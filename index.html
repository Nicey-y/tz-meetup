<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TZ Meetup | Cross-timezone event scheduling</title>
  <link rel="stylesheet" href="/src/styles/style.css">
  <link rel="stylesheet" href="/src/styles/index.css">
</head>
<body>

  <!-- ========== PAGE 1: create event (view 1) ========== -->
  <div id="view-create">
    <h1>Create an event</h1>
    <div class="create-form">
      <div class="form-row">
        <label for="event-name-input">Event Name</label>
        <input type="text" id="event-name-input">
      </div>

      <div class="form-row">
        <label for="start-date-input">Start Date</label>
        <input type="date" id="start-date-input">
      </div>

      <div class="form-row">
        <label for="end-date-input">End Date</label>
        <input type="date" id="end-date-input">
      </div>

      <div class="form-button">
        <button id="create-submit-button">SUBMIT</button>
      </div>
      
      <div class="error-message hidden"></div>
    </div>

    <div class="notice-text">
      Choose start and end date with respect to your time zone inclusively
      (e.g. if event can start at 9PM Oct 23 and end at 3AM Oct 24 your time,
      pick Oct 23 as start and Oct 24 as end date).
    </div>

  </div>
  
  <script type="module" src="/src/main.js"></script>
</body>
</html>
